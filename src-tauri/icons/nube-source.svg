<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Default-hue (243 indigo) "thriving" mood Nube, sized to fill ~90% of the icon canvas.
       s=460, B=386.4; body circle centered at (256,256) r=193. -->
  <defs>
    <filter id="f-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="hsl(243,38%,14%)"/>

  <!-- Ground shadow -->
  <ellipse cx="256" cy="472" rx="115" ry="14"
           fill="rgba(0,0,0,.10)" filter="url(#f-shadow)"/>

  <!-- Feet (clay-deep) -->
  <ellipse cx="201" cy="449" rx="37" ry="23"
           fill="hsl(243,54%,58%)" transform="rotate(-10,201,449)"/>
  <ellipse cx="311" cy="449" rx="37" ry="23"
           fill="hsl(243,54%,58%)" transform="rotate(10,311,449)"/>

  <!-- Body circle (clay-mid, inset ring = clay-deep stroke) -->
  <circle cx="256" cy="256" r="193"
          fill="hsl(243,66%,73%)" stroke="hsl(243,54%,58%)" stroke-width="2"/>

  <!-- Highlight (clay-light, upper-left of body) -->
  <ellipse cx="213" cy="159" rx="97" ry="66"
           fill="hsl(243,72%,86%)" opacity=".7"/>

  <!-- Cheeks (clay-cheek, happy opacity) -->
  <ellipse cx="171" cy="283" rx="31" ry="18"
           fill="hsl(265,58%,78%)" opacity=".85"/>
  <ellipse cx="341" cy="283" rx="31" ry="18"
           fill="hsl(265,58%,78%)" opacity=".85"/>

  <!-- Left eye + glint -->
  <ellipse cx="192" cy="241" rx="27" ry="39" fill="#26282e"/>
  <circle  cx="184" cy="225" r="11" fill="#fff"/>

  <!-- Right eye + glint -->
  <ellipse cx="320" cy="241" rx="27" ry="39" fill="#26282e"/>
  <circle  cx="312" cy="225" r="11" fill="#fff"/>

  <!-- Mouth — thriving big smile: M(cx-mw) (my-1) q mw mw*1.5 mw*2 0 -->
  <path d="M213.5 301 q42.5 64 85 0"
        stroke="#26282e" stroke-width="10" fill="none" stroke-linecap="round"/>
</svg>
