[package]
name = "nubenube"
version = "1.1.1"
description = "Nube Nube, a gentle desktop focus companion: focus timers earn rest, distractions spend it"
authors = ["Nube Nube"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The library name `app_lib` is referenced by `main.rs` (`app_lib::run()`).
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
# Core
tauri = { version = "2.11.2", features = ["tray-icon", "image-png", "macos-private-api"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"

# Tauri plugins
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-clipboard-manager = "2"

# Storage
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["clock"] }

# Active-window + idle. Both crates handle the platform specifics
# internally (macOS = no permission for app name + idle; Linux X11 full, Wayland fallback).
active-win-pos-rs = "0.11"
user-idle = "0.6"

# Localhost WebSocket for the Chromium extension (site tracking + blocking).
tungstenite = "0.29"

# macOS: native NSWindow tweaks for the companion overlay — float over full-screen
# apps + all Spaces (fullScreenAuxiliary) and drag by the window background.
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

# Linux: idle time from GNOME's Mutter IdleMonitor, which works on Wayland where
# XScreenSaver (user-idle's X11 backend) does not.
[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9"

# Recomputes the extension id from its manifest key in browser.rs tests.
[dev-dependencies]
base64 = "0.22"
sha2 = "0.10"
